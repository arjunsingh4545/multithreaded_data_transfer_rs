[package]
name = "multithreaded_data_transfer_rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"                                          # let-chains
description = "Disk-aware parallel / pipelined directory copy"
license = "MIT"
[[bin]]
name = "fastcp"
path = "src/main.rs"
[dependencies]
# ── async runtime: only used by the CLI for Ctrl-C handling ──
tokio = { version = "1.54", features = ["rt-multi-thread", "signal"] }
tokio-util = "0.7"

# ── threading (pipeline lanes, buffer pool, scanning, offset lookup) ──
crossbeam-channel = "0.5"
rayon = "1.12"

# ── operating system ──
libc = "0.2"
filetime = "0.2"

# ── errors ──
thiserror = "2.0"

# ── command line & terminal ──
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
indicatif = "0.17"
console = "0.15"

[dev-dependencies]
tempfile = "3.27"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"            # `device::DeviceId` reads fine
must_use_candidate = "allow"                 # would put #[must_use] on nearly every getter
missing_errors_doc = "allow"                 # error enums are documented per variant instead
